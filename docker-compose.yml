services:
  cabinet:
    container_name: cabinet
    image: ghcr.io/soltros/cabinet:latest
    pull_policy: always
    ports:
      - "4444:4444"
    volumes:
      - ${CABINET_DATA_DIR:-./user_data}:/app/users
    environment:
      PORT: "4444"
      NODE_ENV: production
      STORAGE_PATH: /app/users
      MAX_UPLOAD_SIZE: "${MAX_UPLOAD_SIZE:-53687091200}"
      UPLOAD_REQUEST_TIMEOUT_MS: "${UPLOAD_REQUEST_TIMEOUT_MS:-0}"
      UPLOAD_CHUNK_SIZE: "${UPLOAD_CHUNK_SIZE:-8388608}"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to at least 32 characters}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY to at least 32 characters}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD to at least 12 characters}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      REGISTRATION_CODE: ${REGISTRATION_CODE:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    restart: unless-stopped
