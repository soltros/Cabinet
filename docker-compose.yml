services:
  cabinet:
    container_name: cabinet
    build: .
    ports:
      - "4444:4444"
    volumes:
      - ./user_data:/app/users
    environment:
      PORT: "4444"
      NODE_ENV: production
      STORAGE_PATH: /app/users
      MAX_UPLOAD_SIZE: "524288000"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to at least 32 characters}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY to at least 32 characters}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD to at least 12 characters}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      REGISTRATION_CODE: ${REGISTRATION_CODE:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    restart: unless-stopped
