openapi: 3.0.3
info:
  title: Cabinet API
  version: 1.1.0
  description: API for the Cabinet self-hosted file locker.
servers:
  - url: /api
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: cabinet_token
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
security:
  - bearerAuth: []
  - cookieAuth: []
paths:
  /auth/register:
    post:
      security: []
      summary: Register a user when registration is enabled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, minLength: 3, maxLength: 20 }
                password: { type: string, minLength: 12 }
                registrationCode: { type: string }
      responses:
        '201': { description: User created }
        '400': { description: Invalid request }
        '403': { description: Registration disabled }
        '429': { description: Rate limited }
  /auth/login:
    post:
      security: []
      summary: Log in and set an HttpOnly session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200': { description: Login successful }
        '401': { description: Invalid credentials }
        '429': { description: Rate limited }
  /auth/logout:
    post:
      security: []
      summary: Clear the session cookie
      responses:
        '200': { description: Logged out }
  /auth/me:
    get:
      summary: Return the authenticated user
      responses:
        '200': { description: Current user }
        '401': { description: Unauthorized }
  /files:
    get:
      summary: List owned and internally shared files
      responses:
        '200': { description: File list }
    post:
      summary: Upload one file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                parentId: { type: string, nullable: true }
      responses:
        '201': { description: File uploaded }
        '413': { description: File too large or quota exceeded }
  /files/{id}:
    patch:
      summary: Rename or move an owned file
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: File updated }
    delete:
      summary: Delete an owned file
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: File deleted }
  /files/{id}/content:
    get:
      summary: Stream or download an accessible file
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: query, name: download, schema: { type: boolean } }
        - { in: header, name: Range, schema: { type: string } }
      responses:
        '200': { description: File stream }
        '206': { description: Partial content }
        '416': { description: Invalid range }
  /files/{id}/thumbnail:
    get:
      summary: Get an authorized thumbnail
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: WebP thumbnail }
        '404': { description: Thumbnail not found }
  /files/{id}/share:
    post:
      summary: Internally share a file with another user
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string }
      responses:
        '201': { description: Internal share created }
  /folders:
    get:
      summary: List folders
      responses:
        '200': { description: Folder list }
    post:
      summary: Create a folder
      responses:
        '201': { description: Folder created }
  /folders/{id}:
    delete:
      summary: Delete an empty owned folder
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: Folder deleted }
        '409': { description: Folder is not empty }
  /shares:
    get:
      summary: List active public shares created by the user
      responses:
        '200': { description: Share list }
    post:
      summary: Create a public share
      responses:
        '201': { description: Share created }
  /shares/{id}:
    delete:
      summary: Revoke a public share owned by the user
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: Share revoked }
  /public/shares/{id}:
    get:
      security: []
      summary: Get public share metadata
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: Share metadata }
  /public/shares/{id}/verify:
    post:
      security: []
      summary: Verify a public share password
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: Password accepted }
        '401': { description: Invalid password }
        '429': { description: Rate limited }
  /public/shares/{id}/download:
    post:
      security: []
      summary: Download a public share
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: File stream }
        '410': { description: Expired or limit reached }
        '429': { description: Rate limited }
  /admin/stats:
    get:
      summary: Get global statistics
      responses:
        '200': { description: Statistics }
  /admin/users:
    get:
      summary: List users
      responses:
        '200': { description: User list }
    post:
      summary: Create a user
      responses:
        '201': { description: User created }
  /admin/users/{id}:
    patch:
      summary: Update password or quota
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: User updated }
    delete:
      summary: Delete a user and their storage
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: User deleted }
  /admin/shares:
    get:
      summary: List public shares without password hashes
      responses:
        '200': { description: Share list }
  /admin/shares/{id}:
    delete:
      summary: Revoke any public share
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: Share revoked }
  /admin/logs:
    get:
      summary: View or download server logs
      responses:
        '200': { description: Logs }
  /admin/backup/db:
    get:
      summary: Export database metadata as JSON
      responses:
        '200': { description: JSON backup }
  /admin/scrub:
    post:
      summary: Remove database rows whose files are missing
      responses:
        '200': { description: Scrub result }
